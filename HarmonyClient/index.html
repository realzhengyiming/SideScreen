<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SideScreen 鸿蒙副屏</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font: 16px system-ui, sans-serif; }
    main {
      position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    }
    canvas { grid-area: 1 / 1; display: block; }
    #status {
      position: absolute; inset: auto 16px 24px; margin: 0 auto; width: fit-content;
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: #222;
    }
    button {
      position: absolute; top: 12px; right: 12px; padding: 8px 14px; border: 1px solid #555;
      border-radius: 9px; background: #202020; color: #fff; font: inherit; cursor: pointer;
    }
    :fullscreen button { display: none; }
  </style>
  <script type="module" src="/viewer.js"></script>
</head>
<body>
  <main>
    <canvas aria-label="Mac 扩展桌面"></canvas>
    <button id="fullscreen" type="button">全屏</button>
    <p id="status" role="status">正在连接 Mac…</p>
  </main>
</body>
</html>
