<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SideScreen 鸿蒙副屏</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font: 16px system-ui, sans-serif; }
    main {
      position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    }
    canvas { grid-area: 1 / 1; display: block; }
    #status {
      position: absolute; inset: auto 16px 24px; margin: 0 auto; width: fit-content;
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: #222;
    }
    .overlay { position: absolute; top: 12px; right: 12px; display: grid; justify-items: end; gap: 6px; pointer-events: none; }
    .controls { display: flex; gap: 8px; align-items: flex-start; }
    .metrics {
      display: flex; gap: 12px; padding: 5px 9px; border-radius: 6px;
      background: rgb(0 0 0 / 22%); color: rgb(255 255 255 / 78%); text-shadow: 0 0 2px rgb(0 0 0 / 85%);
      font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    button {
      padding: 8px 14px; border: 1px solid #555;
      border-radius: 9px; background: #202020; color: #fff; font: inherit; cursor: pointer; pointer-events: auto;
    }
    button[aria-pressed="true"] { background: #193c65; border-color: #74aeef; }
    button small:not([hidden]) { display: block; margin-top: 2px; font-size: 11px; color: #ccc; }
    :fullscreen .controls { display: none; }
  </style>
  <script type="module" src="/viewer.js"></script>
</head>
<body>
  <main>
    <canvas aria-label="Mac 扩展桌面"></canvas>
    <div class="overlay">
      <div class="metrics" aria-label="串流性能">
        <span title="从 Mac 开始编码到浏览器提交绘制的估算时间">画面延迟 <span id="frame-delay">—</span></span>
        <span title="使用浏览器网络层时间戳估算 USB 请求往返">USB Ping <span id="ping">—</span></span>
      </div>
      <div class="controls">
        <button id="low-latency" type="button" aria-pressed="false">低延迟</button>
        <button id="fullscreen" type="button" aria-label="全屏">全屏<small id="resolution" hidden></small></button>
      </div>
    </div>
    <p id="status" role="status">正在连接 Mac…</p>
  </main>
</body>
</html>
